# GitHub App manifest template (see https://docs.github.com/en/apps/creating-github-apps)
# Register or update your app in GitHub settings; align webhook URL with your Probot deployment.
# Full setup: README.md "GitHub App manifest (reference)" and https://probot.github.io/

name: SpecSync
description: A GitHub-native, frictionless specification system
url: https://github.com/your-org/specsync
hook_attributes:
  url: https://your-domain.com/webhook
  content_type: json
default_permissions:
  contents: read
  pull_requests: write
  issues: write
  metadata: read
default_events:
  - pull_request
  - push
  - issues
  - issue_comment
  - pull_request_review
  - pull_request_review_comment
